name: Build My FlClash Android ARM64

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "FlClash tag / branch"
        required: true
        default: "v0.8.97"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.47.1"
      GO_VERSION: "1.26.4"
      NDK_VERSION: "r28c"

    steps:

      # ------------------------------------------------------------
      # 1. Download official FlClash source code
      # ------------------------------------------------------------
      - name: Clone official FlClash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euxo pipefail

          echo "Building official FlClash source:"
          echo "${SOURCE_REF}"

          git clone \
            --branch "${SOURCE_REF}" \
            --depth 1 \
            https://github.com/chen08209/FlClash.git .

          echo "===== Current commit ====="
          git rev-parse HEAD

          echo "===== Current tag ====="
          git describe --tags --always

      # ------------------------------------------------------------
      # 2. Fix Clash.Meta submodule SSH URL
      # ------------------------------------------------------------
      - name: Fix and download submodules
        run: |
          set -euxo pipefail

          echo "===== Original .gitmodules ====="
          cat .gitmodules

          # FlClash uses:
          # git@github.com:chen08209/Clash.Meta.git
          #
          # GitHub Actions does not have our SSH private key,
          # so change public GitHub submodules to HTTPS.
          sed -i \
            's#git@github.com:#https://github.com/#g' \
            .gitmodules

          echo "===== Modified .gitmodules ====="
          cat .gitmodules

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== Submodules ====="
          git submodule status --recursive

      # ------------------------------------------------------------
      # 3. Java 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 4. Go
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # ------------------------------------------------------------
      # 5. Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------
      # 6. Flutter
      # ------------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ------------------------------------------------------------
      # 7. Android NDK
      # ------------------------------------------------------------
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      # ------------------------------------------------------------
      # 8. Gradle cache
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ------------------------------------------------------------
      # 9. Print versions
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Go ====="
          go version

          echo "===== Rust ====="
          rustc --version
          cargo --version

          echo "===== Java ====="
          java -version

          echo "===== Android NDK ====="
          echo "${{ steps.ndk.outputs.ndk-path }}"

      # ------------------------------------------------------------
      # 10. Flutter dependencies
      # ------------------------------------------------------------
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      # ------------------------------------------------------------
      # 11. Build only Android ARM64
      #     Suitable for vivo X100 Ultra
      # ------------------------------------------------------------
      - name: Build FlClash Android ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail

          dart setup.dart android \
            --arch arm64 \
            --env stable \
            -v

      # ------------------------------------------------------------
      # 12. Display generated files
      # ------------------------------------------------------------
      - name: Show build output
        run: |
          echo "===== dist ====="

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist."
            exit 1
          fi

          find dist -type f -print

          echo "===== APK files ====="

          APK_COUNT=$(find dist -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          find dist -type f -name "*.apk" -print

      # ------------------------------------------------------------
      # 13. SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256
        run: |
          find dist \
            -type f \
            -name "*.apk" \
            -exec sha256sum {} \; \
            | tee SHA256SUMS.txt

          echo "===== SHA256 ====="
          cat SHA256SUMS.txt

      # ------------------------------------------------------------
      # 14. Upload APK
      # ------------------------------------------------------------
      - name: Upload self-built APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-${{ inputs.source_ref }}-Android-ARM64-self-built
          path: |
            dist/
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
