name: Build My FlClash Android ARM64

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "FlClash tag / branch / commit"
        required: true
        default: "v0.8.97"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.47.1"
      GO_VERSION: "1.26.4"
      NDK_VERSION: "r28c"

    steps:
      - name: Checkout FlClash
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show versions
        run: |
          flutter --version
          dart --version
          go version
          rustc --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android --arch arm64 --env stable -v

      - name: Show APK
        run: |
          find dist -type f -maxdepth 2 -print
          sha256sum dist/*android-arm64-v8a*.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-v0.8.97-Android-ARM64-self-built
          path: |
            dist/*android-arm64-v8a*.apk
            SHA256SUMS.txt
          retention-days: 7
